  </head>
  <body>
    <header class="header">
  <div class="container">
    <nav class="nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a href="./index.html" class="nav-link active">Home</a>
        </li>
        <li class="nav-item">
          <a href="./favorites.html" class="nav-link {=$fav-class}"
            >Favorites</a
          >
        </li>
      </ul>
    </nav>

    <a href="./index.html" class="logo"><span>tasty</span>treats </a>

    <label class="switch">
      <input type="checkbox" data-name="theme-switcher" />
      <span class="slider"></span>
    </label>

    <button
      type="button"
      class="menu-toggle-burger js-open-menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="mobile menu"
    >
      <svg class="mobile-menu-burger" width="32" height="32">
        <use href="/TastyTreats/assets/sprite-28368b95.svg#burger"></use>
      </svg>
    </button>
  </div>

  <!-- Mobile menu burger -->
  <div class="mobile-menu js-menu-container" id="mobile-menu">
    <button type="button" class="menu-toggle-close js-close-menu">
      <svg class="modal-menu-close" width="32" height="32">
        <use href="/TastyTreats/assets/sprite-28368b95.svg#cross-close-modal"></use>
      </svg>
    </button>

    <ul class="nav-mobile">
      <li>
        <a class="nav-mobile-link" href="./index.html">Home</a>
      </li>
      <li>
        <a class="nav-mobile-link" href="./favorites.html">Favorites</a>
      </li>
    </ul>

    <label class="switch mobile">
      <input type="checkbox" data-name="theme-switcher" />
      <span class="slider"></span>
    </label>
  </div>
</header>


    <main>
      <section class="hero">
  <div class="container">
    <div class="hero-text">
      <h1>
        Learn to Cook
        <span>Tasty Treats'</span> Customizable Masterclass
      </h1>
      <p class="description">
        TastyTreats - Customize Your Meal with Ingredient Options and
        Step-by-Step Video Guides.
      </p>
      <button class="btn btn-outline" type="button" data-order-popup-open>
        Order now
      </button>
    </div>
    <div class="swiper-hero">
      <div class="swiper-wrapper"></div>
      <div class="swiper-pagination"></div>
    </div>
  </div>
</section>

      <section class="recipes">
  <h2 class="visually-hidden">Recipes</h2>
  <div class="container">
    <aside class="aside">
  <div class="categories">
  <button type="button" class="btn btn-outline-gray btn-all-categories">All categories</button>
  <div class="categories-block">
    <ul class="categories-list"></ul>
  </div>
</div>

  <div class="popular-categories">
  <h3 class="popular-recipes">Popular recipes</h3>
  <ul class="popular-list"></ul>
</div>

</aside>

    <div class="cards">
  <div class="filters">
  <div class="filter-item search">
    <label for="filter-search">Search</label>
    <input
      class="filter-search"
      type="search"
      name="filter-search"
      id="filter-search"
      autocomplete="off"
      placeholder="Enter text"
    />
    <svg class="search-icon" width="18" height="18">
      <use href="/TastyTreats/assets/sprite-28368b95.svg#search-dandruff"></use>
    </svg>
  </div>

  <div class="filter-item time">
    <label for="time-select">Time</label>
    <select class="filter-select" name="time-select" id="time-select">
      <option class="filter-select-option" value="" selected disabled hidden>
        0 min
      </option>
    </select>
  </div>

  <div class="filter-item area">
    <label for="area-select">Area</label>
    <select class="filter-select" name="area-select" id="area-select">
      <option class="filter-select-option" value="" selected disabled hidden>
        Region
      </option>
    </select>
  </div>

  <div class="filter-item ingredients">
    <label for="ingredients-select">Ingredients</label>
    <select
      class="filter-select"
      name="ingredients-select"
      id="ingredients-select"
    >
      <option class="filter-select-option" value="" selected disabled hidden>
        Product
      </option>
    </select>
  </div>

  <div class="reset-container">
    <button type="button" class="btn reset-filters js-reset-filters hidden">
      <svg width="18" height="18">
        <use href="/TastyTreats/assets/sprite-28368b95.svg#cross-close-modal"></use>
      </svg>
      Reset the filter
    </button>
  </div>
</div>

  <div class="cards-grid">
  <div class="loader"></div>
  <ul class="list-recipes"></ul>
  <div class="pagination-wrap js-pag-wrap">
    <div class="btns-back">
      <button type="button" class="pag-start-btn pag-btn">
        <svg class="pag-arrow double pag-arrow1 js-arrow">
          <use href="/TastyTreats/assets/sprite-28368b95.svg#icon-arrow-double"></use>
        </svg>
      </button>
      <button type="button" class="pag-back-btn pag-btn">
        <svg class="pag-arrow js-arrow">
          <use href="/TastyTreats/assets/sprite-28368b95.svg#icon-arrow"></use>
        </svg>
      </button>
    </div>
    <div class="btns-pages js-btns-pages"></div>
    <div class="btns-forward">
      <button type="button" class="pag-forward-btn pag-btn">
        <svg class="pag-arrow pag-back-arrow js-arrow">
          <use href="/TastyTreats/assets/sprite-28368b95.svg#icon-arrow"></use>
        </svg>
      </button>
      <button type="button" class="pag-end-btn pag-btn">
        <svg class="pag-arrow double pag-arrow1 js-arrow">
          <use href="/TastyTreats/assets/sprite-28368b95.svg#icon-arrow-double"></use>
        </svg>
      </button>
    </div>
  </div>
</div>

</div>

  </div>
</section>

      <div class="popup is-hidden" data-modal-popup>
  <div class="container popup-wrapper"></div>
</div>

      <div class="modal-order is-hidden" data-order-popup>
  <div class="inner-container">
    <button
      class="close-btn"
      type="button"
      aria-label="close popup"
      data-order-popup-close
    >
      <svg class="close-icon" width="20" height="20">
        <use href="/TastyTreats/assets/sprite-28368b95.svg#icon-x"></use>
      </svg>
    </button>

    <p class="title-order">Order now</p>

    <form class="form-order">
      <label>
        <span>Name</span>
        <input
          type="text"
          name="name"
          class="input-order"
          autocomplete="name"
        />
      </label>
      <label>
        <span>Phone number</span>
        <input type="tel" name="phoneNumber" class="input-order" />
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" class="input-order" />
      </label>
      <label>
        <span>Comment</span>
        <textarea name="comment" class="textarea-order input-order"></textarea>
      </label>
      <button
        type="submit"
        name="submit"
        class="btn btn-primary send-btn-order"
        disabled
      >
        Send
      </button>
    </form>
  </div>
</div>

    </main>

    
  </body>
</html>
